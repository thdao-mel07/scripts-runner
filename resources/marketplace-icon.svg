<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5EF6"/>
      <stop offset="1" stop-color="#22B8CF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Nền bo góc gradient -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Khung terminal mờ phía sau -->
  <rect x="52" y="60" width="152" height="136" rx="18" fill="#ffffff" opacity="0.12"/>
  <circle cx="72" cy="80" r="5" fill="#ffffff" opacity="0.5"/>
  <circle cx="90" cy="80" r="5" fill="#ffffff" opacity="0.35"/>
  <circle cx="108" cy="80" r="5" fill="#ffffff" opacity="0.22"/>

  <!-- Nút play chính -->
  <g filter="url(#shadow)">
    <circle cx="128" cy="140" r="46" fill="#ffffff"/>
    <path d="M116 118 L154 140 L116 162 Z" fill="#4B3FD6"/>
  </g>
</svg>
